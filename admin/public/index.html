<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add WhatsApp Admin Preview</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./admin.css?v=20260604-admin-responsive" />
  </head>
  <body class="admin-auth-locked">
    <section class="login-screen" data-login-screen>
      <form class="admin-login login-card" data-admin-login>
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </span>
          <div>
            <strong>Add WhatsApp</strong>
            <span>admin.addwhatsapp.com</span>
          </div>
        </div>
        <label>
          <span>管理员账号</span>
          <input data-admin-username name="username" autocomplete="username" value="yojiro" />
        </label>
        <label>
          <span>管理员密码</span>
          <input data-admin-password name="password" type="password" autocomplete="current-password" />
        </label>
        <button type="submit">登录后台</button>
        <small data-admin-login-status></small>
      </form>
    </section>

    <div class="admin-shell" data-admin-shell hidden style="display: none;">
      <aside class="sidebar" aria-label="后台导航">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </span>
          <div>
            <strong>Add WhatsApp</strong>
            <span>admin.addwhatsapp.com</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button type="button" data-route-link="dashboard">运营首页</button>
          <button type="button" data-module-link="users">用户管理</button>
          <button type="button" data-module-link="orders">财务管理</button>
          <button type="button" data-module-link="plans">套餐与限额</button>
          <button type="button" data-module-link="audit">审计日志</button>
        </nav>

        <section class="admin-account-panel" data-admin-account-panel>
          <span>管理员账号</span>
          <strong data-admin-account-name>-</strong>
          <small data-admin-token-expiry></small>
          <button type="button" data-admin-logout>退出登录</button>
        </section>
      </aside>

      <main class="main" data-page-outlet></main>
    </div>

    <script type="module" src="./admin.js?v=20260604-admin-responsive"></script>
  </body>
</html>
