<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add WhatsApp Admin Preview</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <section class="login-screen" data-login-screen>
      <form class="admin-login login-card" data-admin-login>
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </span>
          <div>
            <strong>Add WhatsApp</strong>
            <span>admin.addwhatsapp.com</span>
          </div>
        </div>
        <label>
          <span>管理员账号</span>
          <input data-admin-username name="username" autocomplete="username" value="yojiro" />
        </label>
        <label>
          <span>管理员密码</span>
          <input data-admin-password name="password" type="password" autocomplete="current-password" />
        </label>
        <button type="submit">登录后台</button>
        <small data-admin-login-status></small>
      </form>
    </section>

    <div class="admin-shell" data-admin-shell hidden>
      <aside class="sidebar" aria-label="后台导航">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </span>
          <div>
            <strong>Add WhatsApp</strong>
            <span>admin.addwhatsapp.com</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button type="button" data-route-link="dashboard">运营首页</button>
          <button type="button" data-module-link="users">注册用户</button>
          <button type="button" data-module-link="plans">套餐与订阅</button>
          <button type="button" data-module-link="credits">额度账本</button>
          <button type="button" data-module-link="usage">用量限额</button>
          <button type="button" data-module-link="orders">订单与入账</button>
          <button type="button" data-module-link="imports">名单审计</button>
          <button type="button" data-module-link="referrals">推荐审核</button>
          <button type="button" data-module-link="workspaces">设备与工作台</button>
          <button type="button" data-module-link="audit">审计日志</button>
        </nav>

        <p class="sidebar-note">
          管理台只放运营与审计能力。公开官网继续留在 website，桌面端继续留在 src，API 后续独立部署到 api.addwhatsapp.com。
        </p>
      </aside>

      <main class="main" data-page-outlet></main>
    </div>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
